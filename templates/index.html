<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SneakersBotMX - Panel de Control</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
        #chat-container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        #chat-box { height: 300px; overflow-y: scroll; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; }
        #chat-input { width: 80%; padding: 10px; }
        button { padding: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div id="chat-container">
    <h2>Asistente Virtual SneakersBotMX</h2>
    <div id="chat-box"></div>
    <input type="text" id="chat-input" placeholder="Escribe tu mensaje aquí...">
    <button onclick="enviarMensaje()">Enviar</button>
</div>

<script>
async function enviarMensaje() {
    const input = document.getElementById('chat-input');
    const mensaje = input.value.trim();
    if (!mensaje) return;

    // Mostrar mensaje del usuario
    const chatBox = document.getElementById('chat-box');
    chatBox.innerHTML += `<p><b>Tú:</b> ${mensaje}</p>`;
    input.value = '';

    try {
        // Enviar al servidor Python (Backend en Railway)
        const response = await fetch('/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message: mensaje})
        });

        if (!response.ok) throw new Error('Error en el servidor');

        const data = await response.json();
        
        // Mostrar respuesta del bot
        chatBox.innerHTML += `<p><b>Bot:</b> ${data.reply}</p>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    } catch (error) {
        console.error("Error:", error);
        chatBox.innerHTML += `<p style="color:red;">Error de conexión.</p>`;
    }
}

// Permitir enviar con la tecla Enter
document.getElementById('chat-input').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') enviarMensaje();
});
</script>

</body>
</html>
